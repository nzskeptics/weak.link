<!doctype html>
<html lang="en" class="h-100">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Weak Link Tracker Cleaner</title>
		<meta property="og:site_name" content="Weak Link">
		<meta property="og:title" content="Weak Link Tracker Cleaner">
		<meta property="og:description" name="description" content="Remove common tracking IDs from shared URLs">
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://weak.link/clean/">
		<meta property="og:image" content="https://weak.link/logo.jpg">
		<meta name="twitter:card" content="summary_large_image">
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
		<link rel="manifest" href="/site.webmanifest">
		<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
		<meta name="msapplication-TileColor" content="#da532c">
		<meta name="theme-color" content="#ffffff">
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-0KGEQRSSN6"></script>
		<script type="text/javascript" src="/analytics.js"></script>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css" rel="stylesheet">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/js/bootstrap.bundle.min.js"></script>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@latest/font/bootstrap-icons.css">
		<script type="module">
			import {createApp} from 'https://unpkg.com/petite-vue?module';
			import {cleanTrackingURL} from '/urls.js';
			createApp({
				url: '',
				error: '',
				get parsedURL() {
					const value = this.url.trim();
					if (!value) return null;
					try {
						return new URL(value);
					} catch (e) {
						try {
							return new URL('https://' + value);
						} catch (e) {
							return null;
						}
					}
				},
				get cleaned() {
					if (!this.parsedURL) return null;
					return cleanTrackingURL(this.parsedURL);
				},
				get cleanedURL() {
					if (!this.cleaned) return '';
					return this.cleaned.url.toString();
				},
				get removedParams() {
					if (!this.cleaned) return [];
					return this.cleaned.removed;
				},
				async paste() {
					this.url = await navigator.clipboard.readText();
				},
				async copyCleaned() {
					if (!this.cleanedURL) return;
					await navigator.clipboard.writeText(this.cleanedURL);
				},
			}).mount();
		</script>
	</head>
	<body class="d-flex flex-column h-100">
		<header class="p-3 text-center bg-dark text-light">
			<nav class="navbar navbar-expand-md text-center">
				<a class="navbar-brand fs-2 text-reset" href="/">
					<img src = "/logo.svg" alt="" style="height: 0.8em; margin-right: 0.2em;" />
					Weak Link
				</a>
				<div class="ms-auto dropdown">
					<button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
						Tools
					</button>
					<ul class="dropdown-menu dropdown-menu-end">
						<li><a class="dropdown-item" href="/">Weak Link generator</a></li>
						<li><a class="dropdown-item" href="/qr/">QR code generator</a></li>
					</ul>
				</div>
			</nav>
		</header>
		<main class="container flex-shrink-0" style="max-width: 960px">
			<section class="container mt-5">
				<h1 class="h2 text-center mb-4">Tracker cleaner</h1>
				<div class="input-group mb-3">
					<input
						id="url"
						type="url"
						spellcheck="false"
						autocorrect="no"
						v-model="url"
						class="form-control form-control-lg"
						placeholder="Paste any URL to remove tracking IDs"
					>
					<button class="btn btn-outline-secondary" type="button" @click="paste">Paste</button>
				</div>
				<div v-if="url && !parsedURL" class="alert alert-danger">Please enter a valid URL.</div>
				<div v-else-if="parsedURL" class="alert alert-secondary">
					<div class="mb-2"><strong>Clean URL</strong></div>
					<div class="text-break"><code>{{cleanedURL}}</code></div>
					<div class="mt-3">
						<span class="badge bg-success">Removed {{removedParams.length}} tracker parameter<span v-if="removedParams.length !== 1">s</span></span>
					</div>
					<ul v-if="removedParams.length" class="mt-2 mb-0">
						<li v-for="param in removedParams">{{param}}</li>
					</ul>
				</div>
				<div class="d-flex gap-2 flex-wrap justify-content-center">
					<button class="btn btn-primary" type="button" :disabled="!cleanedURL" @click="copyCleaned">Copy cleaned URL</button>
					<a class="btn btn-outline-secondary" href="/">Back to Weak Link generator</a>
				</div>
			</section>
		</main>
		<footer class="footer mt-auto py-3 text-center bg-dark text-light">
			<p>This website was created by the <a href="https://skeptics.nz" target="_blank" rel="noopener" class="text-reset">NZ Skeptics</a></p>
		</footer>
	</body>
</html>
