<!doctype html>
<html lang="en" class="h-100">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Weak Link QR Generator</title>
		<meta property="og:site_name" content="Weak Link">
		<meta property="og:title" content="Weak Link QR Generator">
		<meta property="og:description" name="description" content="Generate QR codes for Weak Link URLs">
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://weak.link/qr/">
		<meta property="og:image" content="https://weak.link/logo.jpg">
		<meta name="twitter:card" content="summary_large_image">
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
		<link rel="manifest" href="/site.webmanifest">
		<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
		<meta name="msapplication-TileColor" content="#da532c">
		<meta name="theme-color" content="#ffffff">
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-0KGEQRSSN6"></script>
		<script type="text/javascript" src="/analytics.js"></script>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css" rel="stylesheet">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/js/bootstrap.bundle.min.js"></script>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@latest/font/bootstrap-icons.css">
		<script src="https://cdn.jsdelivr.net/npm/qrcode@latest/build/qrcode.min.js"></script>
		<script type="module">
			import {createApp} from 'https://unpkg.com/petite-vue?module';
			createApp({
				link: '',
				error: '',
				get normalizedLink() {
					const value = this.link.trim();
					if (!value) return null;
					let parsed;
					try {
						parsed = new URL(value);
					} catch (e) {
						try {
							parsed = new URL('https://' + value);
						} catch (e) {
							return null;
						}
					}
					if (!['http:', 'https:'].includes(parsed.protocol)) return null;
					return parsed.toString();
				},
				async generate() {
					this.error = '';
					if (!this.link.trim()) {
						this.clearCanvas();
						return;
					}
					if (!this.normalizedLink) {
						this.error = 'Please enter a valid http or https URL.';
						this.clearCanvas();
						return;
					}
					try {
						await QRCode.toCanvas(this.$refs.canvas, this.normalizedLink, {
							width: 320,
							margin: 2,
						});
					} catch (e) {
						this.error = 'Unable to generate QR code for this URL.';
						this.clearCanvas();
					}
				},
				clearCanvas() {
					if (!this.$refs.canvas) return;
					const context = this.$refs.canvas.getContext('2d');
					context.clearRect(0, 0, this.$refs.canvas.width, this.$refs.canvas.height);
				},
				async paste() {
					this.link = await navigator.clipboard.readText();
					await this.generate();
				},
				download() {
					if (!this.$refs.canvas) return;
					const imageURL = this.$refs.canvas.toDataURL('image/png');
					const link = document.createElement('a');
					link.href = imageURL;
					link.download = 'weak-link-qr.png';
					link.click();
				},
				mounted() {
					const params = new URLSearchParams(window.location.search);
					const initial = params.get('link');
					if (initial) {
						this.link = initial;
						this.generate();
					}
				},
			}).mount();
		</script>
	</head>
	<body class="d-flex flex-column h-100">
		<header class="p-3 text-center bg-dark text-light">
			<nav class="navbar navbar-expand-md text-center">
				<a class="navbar-brand fs-2 text-reset" href="/">
					<img src = "/logo.svg" alt="" style="height: 0.8em; margin-right: 0.2em;" />
					Weak Link
				</a>
				<div class="ms-auto dropdown">
					<button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
						Tools
					</button>
					<ul class="dropdown-menu dropdown-menu-end">
						<li><a class="dropdown-item" href="/">Weak Link generator</a></li>
						<li><a class="dropdown-item" href="/clean/">Tracker cleaner</a></li>
					</ul>
				</div>
			</nav>
		</header>
		<main class="container flex-shrink-0" style="max-width: 960px">
			<section class="container mt-5">
				<h1 class="h2 text-center mb-4">Generate a QR code for a Weak Link</h1>
				<div class="input-group mb-3">
					<input
						id="link"
						type="url"
						spellcheck="false"
						autocorrect="no"
						v-model="link"
						@input="generate"
						class="form-control form-control-lg"
						placeholder="Paste a Weak Link URL"
					>
					<button class="btn btn-outline-secondary" type="button" @click="paste">Paste</button>
				</div>
				<p v-if="error" class="text-danger">{{error}}</p>
				<div class="text-center mt-4">
					<canvas ref="canvas" class="border rounded p-2 bg-white" width="320" height="320"></canvas>
				</div>
				<div class="text-center mt-3">
					<button class="btn btn-outline-secondary" type="button" @click="download">Download PNG</button>
				</div>
				<p class="text-center mt-4"><a href="/">Back to generator</a></p>
			</section>
		</main>
		<footer class="footer mt-auto py-3 text-center bg-dark text-light">
			<p>This website was created by the <a href="https://skeptics.nz" target="_blank" rel="noopener" class="text-reset">NZ Skeptics</a></p>
		</footer>
	</body>
</html>
